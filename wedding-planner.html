<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Élise & Co. — Wedding Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #fdf8f2;
      --blush: #e8c9bc;
      --rose:  #c2796a;
      --wine:  #7a3f3a;
      --ink:   #2e1f1a;
      --mist:  #f4ede6;
      --gold:  #b89068;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #f0d9cf55 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 90%, #d4a89a33 0%, transparent 60%),
        var(--cream);
      overflow: hidden;
    }

    .hero::before, .hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .hero::before {
      width: 520px; height: 520px;
      top: -140px; right: -140px;
      background: radial-gradient(circle, #e8c9bc30 0%, transparent 70%);
      animation: drift 12s ease-in-out infinite alternate;
    }
    .hero::after {
      width: 380px; height: 380px;
      bottom: -100px; left: -80px;
      background: radial-gradient(circle, #c2796a1a 0%, transparent 70%);
      animation: drift 16s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(20px, 30px) scale(1.05); }
    }

    .hero-eyebrow {
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(56px, 9vw, 110px);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--ink);
      opacity: 0;
      animation: fadeUp 0.9s 0.4s forwards;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--rose);
    }

    .hero-sub {
      margin-top: 28px;
      font-size: 15px;
      font-weight: 300;
      color: var(--wine);
      letter-spacing: 0.06em;
      max-width: 380px;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.9s 0.6s forwards;
    }

    .hero-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 36px auto 0;
      width: 180px;
      opacity: 0;
      animation: fadeUp 0.8s 0.8s forwards;
    }
    .hero-divider span { flex: 1; height: 1px; background: var(--blush); }
    .hero-divider i { font-style: normal; font-size: 18px; color: var(--gold); }

    .scroll-hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--blush);
      opacity: 0;
      animation: fadeUp 1s 1.2s forwards;
    }
    .scroll-hint::after {
      content: '';
      width: 1px;
      height: 36
